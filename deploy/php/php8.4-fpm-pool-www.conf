; FundFlow SaaS — recommended www pool for php8.4-fpm
;
; Merge these values into /etc/php/8.4/fpm/pool.d/www.conf
; (or `sudo cp` this file over the active pool after reviewing).
;
; Sized for ~100 members + admin peaks on a 4-core / ~15 GiB host.
; max_children * ~180MB ≈ ~3.6 GiB upper bound for workers.

[www]
user = www-data
group = www-data

listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Align with nginx fastcgi_read_timeout / long admin imports
request_terminate_timeout = 120s

slowlog = /var/log/php8.4-fpm-www.slow.log
request_slowlog_timeout = 5s

catch_workers_output = yes
decorate_workers_output = no

security.limit_extensions = .php .phar

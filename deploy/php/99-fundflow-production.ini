; FundFlow SaaS — PHP-FPM production overrides (PHP 8.4)
;
; Install:
;   sudo cp deploy/php/99-fundflow-production.ini /etc/php/8.4/fpm/conf.d/99-fundflow-production.ini
;   sudo systemctl reload php8.4-fpm
;
; Scope: FPM only (not CLI). Safe for Filament/Livewire, CSV import, uploads.

memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
max_input_time = 120
max_file_uploads = 50

; Faster path resolution under composer + Filament
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Opcache (module already loaded via 10-opcache.ini)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; Keep timestamps on: deploys take effect after FPM reload without full restart tricks.
; Set revalidate_freq higher only if you always reload FPM on release.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1

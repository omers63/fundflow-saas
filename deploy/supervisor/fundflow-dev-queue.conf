; Laravel queue worker — development checkout (dev.fundflow-saas.osamman.com)
;
; Install on the app server:
;   sudo cp deploy/supervisor/fundflow-dev-queue.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start fundflow-dev-queue
;
; Requires /var/www/dev-fundflow-saas/.env:
;   QUEUE_CONNECTION=database
;   DB_QUEUE_TABLE=jobs_dev

[program:fundflow-dev-queue]
process_name=%(program_name)s
command=php /var/www/dev-fundflow-saas/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --backoff=10
directory=/var/www/dev-fundflow-saas
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/dev-fundflow-saas/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600

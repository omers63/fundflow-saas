# FundFlow SaaS — development tenant vhost (dev subdomain)
#
# Install:
#   sudo cp deploy/nginx/fundflow-saas-dev.conf /etc/nginx/sites-available/fundflow-saas-dev
#   sudo ln -sfn /etc/nginx/sites-available/fundflow-saas-dev /etc/nginx/sites-enabled/fundflow-saas-dev
#   sudo nginx -t && sudo systemctl reload nginx
#
# More specific than the production wildcard (*.fundflow-saas.osamman.com), so nginx
# routes only this host to the development checkout on the development branch.
# Shared TLS cert + Reverb process with production.

server {
    listen 80;
    listen [::]:80;
    server_name dev.fundflow-saas.osamman.com;

    location /.well-known/acme-challenge/ {
        root /var/www/dev-fundflow-saas/public;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.fundflow-saas.osamman.com;

    ssl_certificate /etc/letsencrypt/live/fundflow-saas.osamman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fundflow-saas.osamman.com/privkey.pem;

    root /var/www/dev-fundflow-saas/public;
    index index.php;
    charset utf-8;

    client_max_body_size 25m;
    client_body_timeout 120s;
    send_timeout 120s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 60m;
        proxy_send_timeout 60m;
        proxy_pass http://127.0.0.1:8080;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
